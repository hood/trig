[package]
name = "trig-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
rocksdb = { version = "0.25", default-features = false, features = ["lz4", "zstd"] }
regex = "1"
regex-syntax = "0.8"
ignore = "0.4"
memchr = "2"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
roaring = "0.11"
parking_lot = "0.12"
rustc-hash = "2"
