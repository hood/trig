[workspace]
resolver = "2"
members = ["crates/core", "crates/ffi", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
trig-core = { path = "crates/core" }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
